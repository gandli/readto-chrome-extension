version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Group patch + minor bumps of dev tooling so the PR queue stays tidy.
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group patch + minor bumps of runtime deps too.
      runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps are handled manually to control API-break blast radius.
      # This applies to *all* dependencies — API-breaking upgrades require
      # human review + regression testing in a dedicated branch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Action major bumps often break inputs/outputs — pin via SHA in Phase 2.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
